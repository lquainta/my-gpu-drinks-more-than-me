[project]
name = "jarvis"
version = "0.1.0"
description = "A voice interface for Claude Code, in the manner of J.A.R.V.I.S."
readme = "README.md"
authors = [
    { name = "Landon Quaintance", email = "lquainta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
