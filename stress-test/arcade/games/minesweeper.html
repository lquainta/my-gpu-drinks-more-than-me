<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINESWEEPER // HUD</title>
<style>
  :root {
    --bg: #05080f;
    --cyan: #7fdbff;
    --cyan-dim: rgba(127, 219, 255, 0.35);
    --cyan-faint: rgba(127, 219, 255, 0.08);
    --red: #ff4d6d;
    --green: #6dffb0;
    --amber: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--cyan);
    font-family: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 40px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(127,219,255,0.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(127,219,255,0.025) 0 1px, transparent 1px 3px),
      var(--bg);
    user-select: none;
    -webkit-user-select: none;
  }
  a.back {
    align-self: flex-start;
    color: var(--cyan);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.7;
    border: 1px solid var(--cyan-dim);
    padding: 4px 10px;
    transition: opacity .2s, box-shadow .2s;
  }
  a.back:hover { opacity: 1; box-shadow: 0 0 10px var(--cyan-dim); }
  h1 {
    margin: 18px 0 6px;
    font-size: 28px;
    letter-spacing: 8px;
    font-weight: 400;
    text-shadow: 0 0 8px var(--cyan), 0 0 20px rgba(127,219,255,0.5);
  }
  .sub { font-size: 11px; letter-spacing: 3px; opacity: 0.5; margin-bottom: 18px; }
  .panel {
    position: relative;
    border: 1px solid var(--cyan-dim);
    background: rgba(5, 12, 22, 0.8);
    box-shadow: 0 0 24px rgba(127,219,255,0.15), inset 0 0 24px rgba(127,219,255,0.05);
    padding: 16px;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    border: 2px solid var(--cyan);
    filter: drop-shadow(0 0 4px var(--cyan));
  }
  .panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  button {
    font-family: inherit;
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan-dim);
    padding: 6px 14px;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .15s;
  }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan-dim); }
  button.active {
    background: var(--cyan-faint);
    border-color: var(--cyan);
    text-shadow: 0 0 6px var(--cyan);
    box-shadow: 0 0 12px var(--cyan-dim), inset 0 0 8px var(--cyan-dim);
  }
  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }
  .readout {
    min-width: 90px;
    text-align: center;
    border: 1px solid var(--cyan-dim);
    padding: 4px 10px;
  }
  .readout .label { font-size: 9px; letter-spacing: 2px; opacity: 0.55; }
  .readout .value {
    font-size: 22px;
    text-shadow: 0 0 8px var(--cyan);
    font-variant-numeric: tabular-nums;
  }
  #face {
    font-size: 13px;
    padding: 8px 14px;
    min-width: 110px;
  }
  .board-wrap { overflow-x: auto; max-width: 100%; }
  #board {
    display: grid;
    gap: 2px;
    margin: 0 auto;
    width: max-content;
  }
  .cell {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(127,219,255,0.28);
    background: linear-gradient(145deg, rgba(127,219,255,0.12), rgba(127,219,255,0.03));
    transition: background .1s, box-shadow .1s;
  }
  .cell:hover:not(.revealed) {
    background: rgba(127,219,255,0.22);
    box-shadow: 0 0 8px var(--cyan-dim);
  }
  .cell.revealed {
    cursor: default;
    background: rgba(5, 8, 15, 0.9);
    border-color: rgba(127,219,255,0.10);
  }
  .cell.flag { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
  .cell.mine { color: var(--red); text-shadow: 0 0 8px var(--red); }
  .cell.boom { background: rgba(255,77,109,0.35); box-shadow: 0 0 14px var(--red); }
  .cell.wrong { color: var(--red); text-decoration: line-through; }
  .n1 { color: #7fdbff; } .n2 { color: #6dffb0; } .n3 { color: #ff6b9d; }
  .n4 { color: #b18cff; } .n5 { color: #ffd166; } .n6 { color: #4dfff3; }
  .n7 { color: #ffffff; } .n8 { color: #9aa8b8; }
  .cell[class*=" n"] { text-shadow: 0 0 6px currentColor; }
  #board.lost .cell, #board.won .cell { cursor: default; }
  #board.won .cell.flag { color: var(--green); text-shadow: 0 0 6px var(--green); }
  .message {
    margin-top: 14px;
    text-align: center;
    font-size: 14px;
    letter-spacing: 4px;
    min-height: 20px;
  }
  .message.win { color: var(--green); text-shadow: 0 0 10px var(--green); }
  .message.lose { color: var(--red); text-shadow: 0 0 10px var(--red); }
  .help { margin-top: 18px; font-size: 11px; opacity: 0.45; letter-spacing: 1px; text-align: center; line-height: 1.7; }
  @media (max-width: 520px) {
    .cell { width: 24px; height: 24px; font-size: 13px; }
  }
</style>
</head>
<body>
  <a class="back" href="../index.html">&lt; BACK TO ARCADE</a>
  <h1>MINESWEEPER</h1>
  <div class="sub">// TACTICAL MINEFIELD ANALYSIS //</div>

  <div class="panel">
    <div class="controls">
      <button data-diff="easy" class="active">EASY</button>
      <button data-diff="medium">MEDIUM</button>
      <button data-diff="hard">HARD</button>
    </div>
    <div class="status">
      <div class="readout"><div class="label">MINES</div><div class="value" id="mines">010</div></div>
      <button id="face" title="New game">[ RESET ]</button>
      <div class="readout"><div class="label">TIME</div><div class="value" id="timer">000</div></div>
    </div>
    <div class="board-wrap"><div id="board"></div></div>
    <div class="message" id="message">AWAITING INPUT</div>
  </div>

  <div class="help">
    LEFT-CLICK: REVEAL &nbsp;|&nbsp; RIGHT-CLICK: FLAG &nbsp;|&nbsp; CLICK A NUMBER WITH MATCHING FLAGS: CHORD<br>
    TOUCH: LONG-PRESS TO FLAG &nbsp;|&nbsp; R: RESET
  </div>

<script>
(() => {
  const DIFFS = {
    easy:   { rows: 9,  cols: 9,  mines: 10 },
    medium: { rows: 16, cols: 16, mines: 40 },
    hard:   { rows: 16, cols: 30, mines: 99 },
  };

  const boardEl = document.getElementById('board');
  const minesEl = document.getElementById('mines');
  const timerEl = document.getElementById('timer');
  const msgEl = document.getElementById('message');
  const faceEl = document.getElementById('face');

  let diff = 'easy';
  let rows, cols, mineCount;
  let cells = [];      // { mine, adj, revealed, flagged, el }
  let started, over, revealedCount, flagCount;
  let timerId = null, seconds = 0;

  const pad = n => {
    const neg = n < 0;
    const s = String(Math.min(999, Math.abs(n))).padStart(3, '0');
    return neg ? '-' + s.slice(1) : s;
  };
  const idx = (r, c) => r * cols + c;

  function neighbors(i) {
    const r = Math.floor(i / cols), c = i % cols, out = [];
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push(idx(nr, nc));
      }
    return out;
  }

  function newGame() {
    ({ rows, cols, mines: mineCount } = DIFFS[diff]);
    started = false; over = false; revealedCount = 0; flagCount = 0;
    stopTimer(); seconds = 0;
    timerEl.textContent = pad(0);
    minesEl.textContent = pad(mineCount);
    msgEl.textContent = 'AWAITING INPUT';
    msgEl.className = 'message';
    faceEl.textContent = '[ RESET ]';
    boardEl.className = '';
    boardEl.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    boardEl.innerHTML = '';
    cells = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < rows * cols; i++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.i = i;
      frag.appendChild(el);
      cells.push({ mine: false, adj: 0, revealed: false, flagged: false, el });
    }
    boardEl.appendChild(frag);
  }

  function placeMines(safeIdx) {
    // Keep the first click and its neighbors clear so the opening is always a zero when possible.
    const exclude = new Set([safeIdx, ...neighbors(safeIdx)]);
    if (rows * cols - exclude.size < mineCount) { exclude.clear(); exclude.add(safeIdx); }
    const pool = [];
    for (let i = 0; i < rows * cols; i++) if (!exclude.has(i)) pool.push(i);
    for (let k = 0; k < mineCount; k++) {
      const j = k + Math.floor(Math.random() * (pool.length - k));
      [pool[k], pool[j]] = [pool[j], pool[k]];
      cells[pool[k]].mine = true;
    }
    for (let i = 0; i < cells.length; i++)
      cells[i].adj = neighbors(i).reduce((a, n) => a + (cells[n].mine ? 1 : 0), 0);
  }

  function startTimer() {
    timerId = setInterval(() => {
      seconds++;
      timerEl.textContent = pad(seconds);
    }, 1000);
  }
  function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

  function renderCell(i) {
    const c = cells[i], el = c.el;
    el.className = 'cell';
    el.textContent = '';
    if (c.revealed) {
      el.classList.add('revealed');
      if (c.mine) { el.classList.add('mine'); el.textContent = '✹'; }
      else if (c.adj) { el.classList.add('n' + c.adj); el.textContent = c.adj; }
    } else if (c.flagged) {
      el.classList.add('flag');
      el.textContent = '⚑';
    }
  }

  function reveal(i) {
    const start = cells[i];
    if (start.revealed || start.flagged) return;
    if (start.mine) { lose(i); return; }
    // Iterative flood fill
    const stack = [i];
    while (stack.length) {
      const k = stack.pop();
      const c = cells[k];
      if (c.revealed || c.flagged || c.mine) continue;
      c.revealed = true;
      revealedCount++;
      renderCell(k);
      if (c.adj === 0) for (const n of neighbors(k)) if (!cells[n].revealed) stack.push(n);
    }
    checkWin();
  }

  function chord(i) {
    const c = cells[i];
    if (!c.revealed || !c.adj) return;
    const ns = neighbors(i);
    const flags = ns.filter(n => cells[n].flagged).length;
    if (flags !== c.adj) return;
    for (const n of ns) {
      if (over) return;
      if (!cells[n].flagged && !cells[n].revealed) reveal(n);
    }
  }

  function toggleFlag(i) {
    const c = cells[i];
    if (c.revealed || over) return;
    c.flagged = !c.flagged;
    flagCount += c.flagged ? 1 : -1;
    minesEl.textContent = pad(mineCount - flagCount);
    renderCell(i);
  }

  function lose(i) {
    over = true;
    stopTimer();
    cells.forEach((c, k) => {
      if (c.mine && !c.flagged) { c.revealed = true; renderCell(k); }
      else if (!c.mine && c.flagged) { c.el.classList.add('wrong'); c.el.textContent = '⚑'; }
    });
    cells[i].el.classList.add('boom');
    boardEl.className = 'lost';
    msgEl.textContent = '// MINE DETONATED - MISSION FAILED //';
    msgEl.className = 'message lose';
    faceEl.textContent = '[ RETRY ]';
  }

  function checkWin() {
    if (over || revealedCount !== rows * cols - mineCount) return;
    over = true;
    stopTimer();
    cells.forEach((c, k) => {
      if (c.mine && !c.flagged) { c.flagged = true; renderCell(k); }
    });
    flagCount = mineCount;
    minesEl.textContent = pad(0);
    boardEl.className = 'won';
    msgEl.textContent = `// FIELD CLEARED IN ${seconds}s - ${diff.toUpperCase()} //`;
    msgEl.className = 'message win';
    faceEl.textContent = '[ AGAIN ]';
  }

  function handleReveal(i) {
    if (over) return;
    const c = cells[i];
    if (c.flagged) return;
    if (!started) {
      started = true;
      placeMines(i);
      startTimer();
      msgEl.textContent = 'SCANNING...';
    }
    if (c.revealed) chord(i); else reveal(i);
  }

  // Mouse input
  boardEl.addEventListener('click', e => {
    const t = e.target.closest('.cell');
    if (!t) return;
    if (suppressClick) { suppressClick = false; return; }
    handleReveal(+t.dataset.i);
  });
  boardEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const t = e.target.closest('.cell');
    if (!t || over) return;
    toggleFlag(+t.dataset.i);
  });
  boardEl.addEventListener('auxclick', e => {
    if (e.button !== 1) return;
    const t = e.target.closest('.cell');
    if (t && !over && started) chord(+t.dataset.i);
  });

  // Touch: long-press to flag
  let pressTimer = null, suppressClick = false;
  boardEl.addEventListener('touchstart', e => {
    const t = e.target.closest('.cell');
    if (!t) return;
    suppressClick = false;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      suppressClick = true;
      toggleFlag(+t.dataset.i);
      if (navigator.vibrate) navigator.vibrate(20);
    }, 400);
  }, { passive: true });
  const cancelPress = () => { if (pressTimer) clearTimeout(pressTimer); pressTimer = null; };
  boardEl.addEventListener('touchend', cancelPress);
  boardEl.addEventListener('touchmove', cancelPress, { passive: true });

  // Controls
  document.querySelectorAll('[data-diff]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      diff = btn.dataset.diff;
      newGame();
    });
  });
  faceEl.addEventListener('click', newGame);
  document.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') newGame();
  });

  newGame();
})();
</script>
</body>
</html>
